databaseChangeLog:
  - changeSet:
      id: 002-create-conversion-jobs
      author: igor
      changes:
        - createTable:
            tableName: conversion_jobs
            columns:
              - column:
                  name: job_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    unique: true
                    nullable: false

              - column:
                  name: input_bucket
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: input_object_key
                  type: varchar(1024)
                  constraints:
                    nullable: false

              - column:
                  name: file_name
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: 'PENDING'
                  constraints:
                    nullable: false

              - column:
                  name: attempt_count
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: error_message
                  type: TEXT

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false

              - column:
                  name: started_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: completed_at
                  type: TIMESTAMP WITH TIME ZONE

        - addForeignKeyConstraint:
            baseTableName: conversion_jobs
            baseColumnNames: event_id
            referencedTableName: inbox
            referencedColumnNames: event_id
            constraintName: fk_conversion_jobs_inbox

        - sql:
            sql: >
              ALTER TABLE conversion_jobs
              ADD CONSTRAINT chk_conversion_jobs_status
              CHECK (status IN ('PENDING', 'PROCESSING', 'COMPLETED', 'FAILED'));